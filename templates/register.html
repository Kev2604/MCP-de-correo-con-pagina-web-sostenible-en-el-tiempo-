<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #111827; padding: 30px; border-radius: 12px; width: 380px; }
    input, select { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #334155; background: #1f2937; color: white; }
    button { margin-top: 16px; width: 100%; padding: 10px; background: #16a34a; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .error { color: #f87171; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Crear cuenta</h2>
    <form action="/register" method="post">
      <label>Usuario</label>
      <input name="username" required />
      <label>Contraseña</label>
      <input name="password" type="password" required />
      <label>Rol</label>
      <select name="role">
        <option value="user">Usuario</option>
        <option value="admin">Administrador</option>
      </select>
      <button type="submit">Registrar</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <p><a href="/" style="color:#93c5fd;">Volver al login</a></p>
  </div>
</body>
</html>
