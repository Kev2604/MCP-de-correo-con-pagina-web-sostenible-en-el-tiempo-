<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enviar correo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 40px; }
    .card { max-width: 700px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    textarea { min-height: 140px; resize: vertical; }
    button { margin-top: 16px; padding: 10px 16px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    .result { margin-top: 16px; padding: 12px; border-radius: 8px; background: #eef6ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Formulario de envío</h1>
    <form id="mailForm">
      <label>Destinatario</label>
      <input type="email" id="destinatario" name="destinatario" required />

      <label>Asunto</label>
      <input type="text" id="asunto" name="asunto" required />

      <label>Cuerpo</label>
      <textarea id="cuerpo" name="cuerpo" required></textarea>

      <label>HTML opcional</label>
      <textarea id="html" name="html" placeholder="Opcional"></textarea>

      <button type="submit">Enviar correo</button>
    </form>
    <div id="resultado" class="result" style="display:none"></div>
  </div>

  <script>
    const form = document.getElementById('mailForm');
    const resultado = document.getElementById('resultado');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const response = await fetch('/send', {
        method: 'POST',
        body: data
      });
      const json = await response.json();
      resultado.style.display = 'block';
      resultado.textContent = json.mensaje;
    });
  </script>
</body>
</html>
